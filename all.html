<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Face</title>
    <style>
        .face {
            width: 600px;
            height: 600px;
            background: yellow;
            border: 1px solid black;
            position: relative;
            margin: 40px auto;
        }
        .eyes {
            display: flex;
            justify-content: space-between;
            width: 440px;
            margin: 40px auto 0 auto;
        }
        .eye {
            width: 200px;
            height: 120px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pupil {
            width: 60px;
            height: 60px;
            background: black;
        }
        .mouth {
            width: 500px;
            height: 250px;
            background: black;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 230px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .teeth-row {
            display: flex;
            justify-content: space-between;
            width: 320px;
            margin-top: 20px;
            margin-bottom: 30px;
        }
        .tooth {
            width: 40px;
            height: 40px;
            background: white;
        }
        .tongue-row {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100%;
            margin-top: 30px;
        }
        .tongue {
            width: 100px;
            height: 100px;
            background: red;
            margin: 0 10px;
            position: relative;
        }
        .tongue-divider {
            width: 8px;
            height: 100px;
            background: black;
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>
    <div class="face">
        <div class="eyes">
            <div class="eye"><div class="pupil"></div></div>
            <div class="eye"><div class="pupil"></div></div>
        </div>
        <div class="mouth">
            <div class="teeth-row">
                <div class="tooth"></div>
                <div class="tooth"></div>
                <div class="tooth"></div>
                <div class="tooth"></div>
                <div class="tooth"></div>
                <div class="tooth"></div>
            </div>
            <div class="tongue-row">
                <div class="tongue">
                    <div class="tongue-divider"></div>
                </div>
                <div class="tongue"></div>
            </div>
        </div>
    </div>
</body>
</html>
